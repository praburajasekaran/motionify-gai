[build]
  # Slice C production flip: publish the single Vite runtime only.
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Staging branch deploys
[context.staging]
  command = "npm run build"

[context.staging.environment]
  CONTEXT = "staging"
  NPM_FLAGS = "--legacy-peer-deps --include=dev"

[dev]
  command = "vite"
  port = 8888
  targetPort = 5173
  framework = "#custom"

# API endpoints to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Legacy portal subdomain links normalize to the canonical product origin.
[[redirects]]
  from = "/*"
  to = "https://motionify.studio/:splat"
  status = 301
  force = true
  conditions = {Host = ["portal.motionify.studio"]}

# Block sourcemap access - sourcemaps are for error reporting uploads only.
[[redirects]]
  from = "/assets/*.map"
  to = "/404"
  status = 404
  force = true

# Missing Vite assets must not fall through to the SPA entrypoint. A stale
# browser session can request old hashed chunks after a deploy; serving
# index.html for those URLs turns a recoverable cache miss into a module error.
[[redirects]]
  from = "/assets/*"
  to = "/404"
  status = 404
  force = true

# Slice B compatibility aliases for public handoff links
[[redirects]]
  from = "/auth/verify"
  to = "/verify-inquiry"
  status = 302

[[redirects]]
  from = "/inquiry/verify"
  to = "/verify-inquiry"
  status = 302

[[redirects]]
  from = "/verify-inquiry"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/proposal/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/payment/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/payments/proforma/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/inquiry-status/*"
  to = "/index.html"
  status = 200

# Vite SPA fallbacks. Public Site, public handoff routes, and Portal routes
# all boot through the single Vite entrypoint in dist/index.html.
[[redirects]]
  from = "/portal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portal/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/work"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/project-access"
  to = "/index.html"
  status = 200

# Long-term cache for Vite content-hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Content-Security-Policy — Report-Only mode for monitoring before enforcement
# Portal CSP (Vite SPA with Razorpay, Sentry, Google Fonts, R2 storage)
[[headers]]
  for = "/portal/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com; connect-src 'self' https://*.ingest.sentry.io https://*.r2.cloudflarestorage.com; frame-src https://api.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Public Site and handoff CSP (Vite)
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io; frame-src https://api.razorpay.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/verify-inquiry"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io; frame-src https://api.razorpay.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/proposal/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io; frame-src https://api.razorpay.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/payment/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io; frame-src https://api.razorpay.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/inquiry-status/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io; frame-src https://api.razorpay.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
